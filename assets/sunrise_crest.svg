<svg xmlns="http://www.w3.org/2000/svg" viewBox="130 110 240 210" width="100%" height="100%">
  <defs>
    <!-- Sun Radial Gradient -->
    <radialGradient id="sunGlowSmall" cx="50%" cy="80%" r="80%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#B91C1C" />
    </radialGradient>

    <!-- Ray Gradient -->
    <linearGradient id="rayGradSmall" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Blue Pages Gradient -->
    <linearGradient id="bluePageSmall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="40%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Green Pages Gradient -->
    <linearGradient id="greenPageSmall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="40%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Golden Ring Gradient -->
    <linearGradient id="goldRingSmall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <filter id="crispShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <g id="centerArtClean" filter="url(#crispShadow)">
    
    <!-- 1. Sunburst Radiating Rays -->
    <g id="sunRaysClean">
      <polygon points="247,240 250,125 253,240" fill="url(#rayGradSmall)" />
      
      <polygon points="247,240 224,130 253,240" fill="url(#rayGradSmall)" />
      <polygon points="247,240 276,130 253,240" fill="url(#rayGradSmall)" />
      
      <polygon points="247,240 200,140 253,240" fill="url(#rayGradSmall)" />
      <polygon points="247,240 300,140 253,240" fill="url(#rayGradSmall)" />
      
      <polygon points="247,240 176,156 253,240" fill="url(#rayGradSmall)" />
      <polygon points="247,240 324,156 253,240" fill="url(#rayGradSmall)" />
      
      <polygon points="247,240 156,178 253,240" fill="url(#rayGradSmall)" />
      <polygon points="247,240 344,178 253,240" fill="url(#rayGradSmall)" />
      
      <polygon points="247,240 142,204 253,240" fill="url(#rayGradSmall)" />
      <polygon points="247,240 358,204 253,240" fill="url(#rayGradSmall)" />

      <polygon points="247,240 135,235 253,240" fill="url(#rayGradSmall)" />
      <polygon points="247,240 365,235 253,240" fill="url(#rayGradSmall)" />
    </g>

    <!-- 2. Rising Sun (Half Sphere) -->
    <path d="M 180 248 A 70 70 0 0 1 320 248 Z" fill="url(#sunGlowSmall)" stroke="#D97706" stroke-width="2" />

    <!-- 3. Open Book of Knowledge -->
    <!-- Shadow Base -->
    <path d="M 160 286 C 200 278 245 284 250 288 C 255 284 300 278 340 286 C 330 296 295 292 250 298 C 205 292 170 296 160 286 Z" fill="#0F172A" opacity="0.4" />

    <!-- Left Book Pages (Blue Wing) -->
    <path d="M 152 278 C 190 270 240 275 250 282 L 250 274 C 240 267 190 262 152 270 Z" fill="#1E3A8A" />
    <path d="M 154 274 C 192 266 242 271 250 278 L 250 270 C 242 263 192 258 154 266 Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.8" />
    
    <!-- Main Top Blue Page -->
    <path d="M 156 268 C 195 258 244 265 250 272 C 244 248 190 244 150 256 C 145 264 150 266 156 268 Z" fill="url(#bluePageSmall)" stroke="#1D4ED8" stroke-width="1.8" />
    
    <!-- White leaf accents on Blue Page -->
    <path d="M 164 260 C 195 252 230 256 246 263" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 172 265 C 200 260 228 263 242 268" fill="none" stroke="#BFDBFE" stroke-width="1.5" stroke-linecap="round" />

    <!-- Right Book Pages (Green Wing) -->
    <path d="M 348 278 C 310 270 260 275 250 282 L 250 274 C 260 267 310 262 348 270 Z" fill="#064E3B" />
    <path d="M 346 274 C 308 266 258 271 250 278 L 250 270 C 258 263 308 258 346 266 Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="0.8" />

    <!-- Main Top Green Page -->
    <path d="M 344 268 C 305 258 256 265 250 272 C 256 248 310 244 350 256 C 355 264 350 266 344 268 Z" fill="url(#greenPageSmall)" stroke="#047857" stroke-width="1.8" />

    <!-- White leaf accents on Green Page -->
    <path d="M 336 260 C 305 252 270 256 254 263" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 328 265 C 300 260 272 263 258 268" fill="none" stroke="#A7F3D0" stroke-width="1.5" stroke-linecap="round" />

    <!-- Book Center Spine Joint -->
    <path d="M 248 255 L 252 255 L 252 284 L 248 284 Z" fill="#F59E0B" />

    <!-- Gold Badge at bottom -->
    <g transform="translate(170, 290)">
      <rect x="0" y="0" width="160" height="22" rx="11" fill="url(#goldRingSmall)" stroke="#78350F" stroke-width="0.8" />
      <text x="80" y="15" font-family="'Segoe UI', 'Outfit', sans-serif" font-size="11" font-weight="900" fill="#7F1D1D" text-anchor="middle" letter-spacing="1">
        SUNRISE • SRIKAKULAM
      </text>
    </g>

  </g>
</svg>
